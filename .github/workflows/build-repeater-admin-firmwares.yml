name: Build Repeater Admin Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'repeater-admin-*'

jobs:
  build-repeater-admin-firmwares:
    uses: ./.github/workflows/firmware-builder.yml
    with:
      firmware_type: 'repeater'
      release_title_prefix: 'Repeater Admin Firmware'
      release_draft: false
