name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string
      release_draft:
        required: false
        type: boolean
        default: true

jobs:

  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        run: |
          # get list of firmwares to build
          TARGET_LIST=$(/usr/bin/env bash build.sh get-${{ inputs.firmware_type }}-firmwares-to-build)
          
          # convert targets separated by new line into a json array string
          JSON_ARRAY=$(echo "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # use json array as targets result
          echo "targets=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false # don't cancel other builds if one board fails to build
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # only create release for tagged builds
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="${{ inputs.release_title_prefix }} $GIT_TAG_VERSION"
          draft="${{ inputs.release_draft }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          if [[ "$draft" == "true" ]]; then
            gh release create "$tag" --title "$title" --notes "" --draft
          else
            gh release create "$tag" --title "$title" --notes ""
          fi

          shopt -s nullglob
          files=(out/*)
          if (( ${#files[@]} == 0 )); then
            echo "No firmware assets were downloaded" >&2
            exit 1
          fi

          batch_size=10
          for ((offset = 0; offset < ${#files[@]}; offset += batch_size)); do
            batch=("${files[@]:offset:batch_size}")
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$tag" "${batch[@]}" --clobber; then
                uploaded=true
                break
              fi
              sleep $((attempt * 5))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload release asset batch at offset $offset" >&2
              exit 1
            fi
          done

          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          remote_count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --slurp --jq 'map(length) | add')"
          if [[ "$remote_count" -ne "${#files[@]}" ]]; then
            echo "Release has $remote_count assets; expected ${#files[@]}" >&2
            exit 1
          fi
