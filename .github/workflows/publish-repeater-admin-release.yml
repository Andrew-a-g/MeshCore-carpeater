name: Publish Repeater Admin Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'publish-repeater-admin-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit repeater-admin-v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Repeater Admin Firmware v1.0.0" \
            --notes "Experimental MeshCore repeater firmware with observed-channel reporting and persistent default-allow channel deny rules." \
            --draft=false
